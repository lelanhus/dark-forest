name: Feature request
description: Propose a scoped enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem and a concrete proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or developer problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed behavior and interfaces.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives were considered and why they were not chosen?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should this be validated as complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: checkboxes
    id: risk
    attributes:
      label: Risk and policy check
      options:
        - label: This request does not bypass security, quality, or trust-boundary policies.
          required: true
