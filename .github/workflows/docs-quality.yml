name: docs-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs tooling
        run: |
          npm install --global markdownlint-cli
          python -m pip install --upgrade pip
          pip install codespell yamllint

      - name: Markdown lint
        run: |
          find . -type f -name '*.md' -not -path './.git/*' -print0 | xargs -0 markdownlint --config .markdownlint.yml

      - name: YAML lint
        run: |
          yamllint -c .yamllint.yml .

      - name: Spelling lint
        run: |
          codespell --config .codespellrc

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --verbose
            './**/*.md'
            './**/*.yml'
            './**/*.yaml'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
