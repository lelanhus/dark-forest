name: policy-checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate semantic PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  dco-signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate DCO sign-off trailers
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          mapfile -t commits < <(git rev-list --no-merges "${base_sha}..${head_sha}")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No non-merge commits to validate."
            exit 0
          fi

          failed=0
          for commit in "${commits[@]}"; do
            if ! git log -1 --pretty=%B "$commit" | grep -Eiq '^Signed-off-by:[[:space:]].+<.+>$'; then
              echo "Missing Signed-off-by trailer in commit: $commit"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "DCO validation failed. Amend commits with: git commit --amend -s"
            exit 1
          fi
