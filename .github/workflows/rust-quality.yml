name: rust-quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (workspace not initialized)
        if: steps.detect.outputs.has_cargo != 'true'
        run: |
          echo "No Cargo.toml found. Rust checks are deferred until workspace scaffolding exists."

      - name: Setup Rust toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust artifacts
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Rust format check
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Rust clippy check
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rustdoc warnings as errors
        if: steps.detect.outputs.has_cargo == 'true'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Rust test suite
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo test --workspace --all-targets --all-features

      - name: Install cargo-llvm-cov
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage gate (line coverage >= 85%)
        if: steps.detect.outputs.has_cargo == 'true'
        run: |
          cargo llvm-cov --workspace --all-features --all-targets --summary-only --fail-under-lines 85

      - name: Install cargo-deny
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo install cargo-deny --locked

      - name: Dependency, security, and license checks
        if: steps.detect.outputs.has_cargo == 'true'
        run: cargo deny check advisories licenses bans sources
